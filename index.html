<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九州たんけんダーツ</title>

  <!-- CSSを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="header">
    <h1>九州たんけんダーツ</h1>
    <p>まだ知らない九州に出会おう。</p>
    <p>ダーツが導く運命の探検。</p>
  </div>
  
  <!-- ここから新しく追加 -->
  <div class="dart-area">
  <img class="dart" src="images/dart.png" alt="ダーツ">
  </div>
  <!-- ここまで -->

  <div class="result" id="result" hidden>
    <p>運命の探検先は...！</p>
    <h2 id="place"></h2>

    <div class="photo-grid">
      <img id="photo" alt="探検先のメイン写真">
      <img id="photo2" alt="見どころの写真">
      <img id="photo3" alt="周辺スポットの写真">
      <img id="photo4" alt="ご当地グルメの写真">
    </div>

    <p>今回のチャレンジ</p>
    <h3 id="mission"></h3>
    
    <!-- 子ども・ペット同伴情報 -->
     <div class="companion-info">
      <p id="kids-info"></p>
      <p id="kids-note"></p>
      <p id="pets-info"></p>
      <p id="pets-note"></p>
    </div>
    <!-- ここまで -->
    
    <a id="map-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
      📍 Googleマップで場所を見る
    
    </a>
  </div>


<!-- 探検条件の選択 -->
<div class="filter-area" id="filter-area">
  <h2>🎯 どんな気分？</h2>

  <select id="mood">
    <option value="random">すべて運命に任せる！</option>
    <option value="exciting">ワクワク・楽しみたい</option>
    <option value="moving">感動・癒やされたい</option>
    <option value="active">体を動かしたい</option>
    <option value="learning">歴史・文化を学びたい</option>
  </select>

  <h2>👨‍👩‍👧‍👦 誰と行く？</h2>

  <label>
    <input type="checkbox" id="with-kids">
    子ども連れ
  </label>

  <label>
    <input type="checkbox" id="with-pets">
    ペット連れ
  </label>
</div>



  <div class="button-area">
    <button id="draw">🎯 運命のダーツを投げる!!</button>
  </div>
  
  <!-- JavaScriptを読み込む -->
  <script src="script.js"></script>

</body>
</html>
